<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gas Turbine Maintenance Assistant</title>
<style>
  :root {
    --bg-1: #07090d;
    --bg-2: #1a1108;
    --panel: rgba(16, 20, 28, 0.62);
    --border: rgba(255, 170, 80, 0.28);
    --text: #f1ede6;
    --muted: #b9b2a6;
    --accent: #ff9a3c;
    --accent-2: #ffc46b;
    --user: rgba(255, 154, 60, 0.20);
    --bot: rgba(255, 255, 255, 0.07);
    --notfound: rgba(140, 150, 170, 0.16);
    --error: rgba(220, 70, 60, 0.22);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    /* Gradient is the fallback when WebGL is unavailable; the canvas covers it otherwise. */
    background: radial-gradient(ellipse at 50% 60%, #3a1f08 0%, var(--bg-2) 35%, var(--bg-1) 75%);
    overflow: hidden;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }
  .wrap { position: relative; z-index: 1; height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .chat {
    width: min(760px, 100%);
    height: min(820px, 100%);
    display: flex; flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(16px) saturate(130%);
    -webkit-backdrop-filter: blur(16px) saturate(130%);
    overflow: hidden;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 1.1rem; letter-spacing: 0.02em; }
  header p { margin: 2px 0 0; font-size: 0.8rem; color: var(--muted); }
  button { font: inherit; cursor: pointer; }
  .clear-btn { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font-size: 0.8rem; }
  .clear-btn:hover, .clear-btn:focus-visible { color: var(--text); border-color: var(--accent); }
  .messages { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word;
    animation: fadeIn 0.35s ease-out both;
  }
  .msg.user { align-self: flex-end; background: var(--user); border: 1px solid rgba(255, 154, 60, 0.35); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid rgba(255, 255, 255, 0.10); border-bottom-left-radius: 4px; }
  .msg.notfound { background: var(--notfound); border: 1px dashed rgba(180, 190, 210, 0.5); color: #d6dbe4; font-style: italic; }
  .msg.error { background: var(--error); border: 1px solid rgba(240, 100, 90, 0.55); }
  .sources { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; font-style: normal; }
  .source { display: flex; flex-direction: column; gap: 3px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
  .badge {
    align-self: flex-start; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.03em;
    color: #1b1206; background: linear-gradient(90deg, var(--accent), var(--accent-2));
    padding: 2px 8px; border-radius: 999px;
  }
  .excerpt { font-size: 0.78rem; color: var(--muted); white-space: normal; }
  .file { font-size: 0.72rem; color: var(--muted); }
  .thinking { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
  .dots { display: inline-flex; gap: 4px; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  form { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--border); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  input[type="text"] {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 12px 14px;
  }
  input[type="text"]::placeholder { color: #8f887d; }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .send-btn { border: none; border-radius: 12px; padding: 0 18px; font-weight: 600; color: #1b1206; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .send-btn:focus-visible, .clear-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  input:disabled, .send-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-6px); opacity: 1; } }
  @media (max-width: 600px) {
    .wrap { padding: 0; }
    .chat { height: 100%; border-radius: 0; }
    .msg { max-width: 92%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .msg, .dots span { animation: none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<main class="wrap">
  <section class="chat" aria-label="Gas turbine maintenance chat">
    <header>
      <div>
        <h1>Gas Turbine Maintenance Assistant</h1>
        <p>Answers come only from the maintenance document, with page references.</p>
      </div>
      <button type="button" class="clear-btn" id="clear">Clear chat</button>
    </header>
    <div class="messages" id="messages" role="log" aria-live="polite"></div>
    <form id="form">
      <label for="question" class="sr-only">Your question</label>
      <input type="text" id="question" placeholder="Ask about inspections, intervals, maintenance factors..." autocomplete="off" maxlength="1000">
      <button type="submit" class="send-btn" id="send">Send</button>
    </form>
  </section>
</main>

<script>
  // Chat logic. Kept in a classic script so it works even if the 3D background fails to load.
  const API_URL = "http://localhost:8000/ask";
  const REQUEST_TIMEOUT_MS = 60000;

  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("send");

  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  // All text goes in with textContent so model output or user input can never inject HTML.
  function addMessage(kind, text) {
    const el = document.createElement("div");
    el.className = "msg " + kind;
    el.textContent = text;
    messagesEl.appendChild(el);
    scrollToBottom();
    return el;
  }

  function addAnswer(data) {
    if (!data.found) {
      addMessage("bot notfound", data.answer);
      return;
    }
    const el = addMessage("bot", data.answer);
    const list = document.createElement("div");
    list.className = "sources";
    for (const src of data.sources) {
      const item = document.createElement("div");
      item.className = "source";
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "Source: Page " + src.page;
      const file = document.createElement("span");
      file.className = "file";
      file.textContent = "From " + src.filename + ", page " + src.page + ":";
      const excerpt = document.createElement("span");
      excerpt.className = "excerpt";
      excerpt.textContent = "“" + src.excerpt + "”";
      const section = document.createElement("span");
      section.className = "file";
      section.textContent = src.section ? "Section: " + src.section : "";
      item.append(badge, section, file, excerpt);
      list.appendChild(item);
    }
    el.appendChild(list);
    scrollToBottom();
  }

  function showThinking() {
    const el = document.createElement("div");
    el.className = "msg bot";
    const wrap = document.createElement("span");
    wrap.className = "thinking";
    const label = document.createElement("span");
    label.textContent = "thinking...";
    const dots = document.createElement("span");
    dots.className = "dots";
    for (let i = 0; i < 3; i++) dots.appendChild(document.createElement("span"));
    wrap.append(dots, label);
    el.appendChild(wrap);
    messagesEl.appendChild(el);
    scrollToBottom();
    return el;
  }

  function setBusy(busy) {
    input.disabled = busy;
    sendBtn.disabled = busy;
    if (!busy) input.focus();
  }

  function isValidAnswer(data) {
    return data && typeof data.answer === "string" && typeof data.found === "boolean" && Array.isArray(data.sources);
  }

  async function sendQuestion(question) {
    addMessage("user", question);
    setBusy(true);
    const thinking = showThinking();
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
        signal: controller.signal,
      });
      let data = null;
      try { data = await response.json(); } catch (_) { data = null; }
      thinking.remove();
      if (!response.ok) {
        const message = data && data.error && data.error.message ? data.error.message : "The server returned an error (HTTP " + response.status + ").";
        addMessage("bot error", "Error: " + message);
      } else if (isValidAnswer(data)) {
        addAnswer(data);
      } else {
        addMessage("bot error", "Error: the server sent an unexpected response.");
      }
    } catch (err) {
      thinking.remove();
      if (err.name === "AbortError") {
        addMessage("bot error", "Error: the request timed out. The server may be busy or rate-limited; please try again.");
      } else {
        addMessage("bot error", "Error: cannot reach the server at " + API_URL + ". It may be offline. Start it with: uvicorn server:app --port 8000");
      }
    } finally {
      clearTimeout(timer);
      setBusy(false);
    }
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question || input.disabled) return;
    input.value = "";
    sendQuestion(question);
  });

  document.getElementById("clear").addEventListener("click", () => {
    messagesEl.replaceChildren();
    input.focus();
  });

  addMessage("bot", "Hello! Ask me anything about heavy-duty gas turbine operation and maintenance. I answer only from the document and show the page I used.");
</script>

<script type="module">
  // Animated 3D background: a rotating turbine rotor with glowing hot-gas particles.
  const THREE_URL = "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.170.0/three.module.min.js";
  const canvas = document.getElementById("scene");

  function hasWebGL() {
    try {
      const test = document.createElement("canvas");
      return !!(window.WebGLRenderingContext && (test.getContext("webgl2") || test.getContext("webgl")));
    } catch (_) { return false; }
  }

  async function start() {
    if (!hasWebGL()) { canvas.remove(); return; }  // body gradient stays as the fallback
    let THREE;
    try { THREE = await import(THREE_URL); } catch (_) { canvas.remove(); return; }

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x07090d, 0.045);
    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
    camera.position.set(0, 1.2, 9);

    scene.add(new THREE.AmbientLight(0x404858, 1.2));
    const hot = new THREE.PointLight(0xff8a2a, 60, 30);
    hot.position.set(0, 0, 3);
    scene.add(hot);
    const rim = new THREE.DirectionalLight(0x9fb4ff, 0.8);
    rim.position.set(-5, 6, 4);
    scene.add(rim);

    // Rotor: hub, shaft and three blade stages.
    const rotor = new THREE.Group();
    const metal = new THREE.MeshStandardMaterial({ color: 0x8a8f99, metalness: 0.85, roughness: 0.35 });
    const bladeMat = new THREE.MeshStandardMaterial({ color: 0xb8a58c, metalness: 0.9, roughness: 0.25, emissive: 0x2a1000 });
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 9, 32), metal);
    shaft.rotation.x = Math.PI / 2;
    rotor.add(shaft);
    const stages = [
      { z: -1.6, radius: 2.6, blades: 28 },
      { z: 0.0, radius: 2.2, blades: 24 },
      { z: 1.6, radius: 1.8, blades: 20 },
    ];
    for (const s of stages) {
      const disk = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.35, 40), metal);
      disk.rotation.x = Math.PI / 2;
      disk.position.z = s.z;
      rotor.add(disk);
      const bladeGeo = new THREE.BoxGeometry(0.16, s.radius - 0.8, 0.5);
      for (let i = 0; i < s.blades; i++) {
        const angle = (i / s.blades) * Math.PI * 2;
        const blade = new THREE.Mesh(bladeGeo, bladeMat);
        const r = 0.8 + (s.radius - 0.8) / 2;
        blade.position.set(Math.cos(angle) * r, Math.sin(angle) * r, s.z);
        blade.rotation.z = angle - Math.PI / 2;
        blade.rotation.y = 0.45;  // blade twist
        rotor.add(blade);
      }
    }
    rotor.rotation.y = -0.55;
    rotor.rotation.x = 0.15;
    scene.add(rotor);

    // Hot airflow particles streaming along the shaft axis.
    const COUNT = window.innerWidth < 600 ? 500 : 1200;
    const positions = new Float32Array(COUNT * 3);
    const speeds = new Float32Array(COUNT);
    function resetParticle(i, anywhere) {
      const angle = Math.random() * Math.PI * 2;
      const r = 0.5 + Math.random() * 2.8;
      positions[i * 3] = Math.cos(angle) * r;
      positions[i * 3 + 1] = Math.sin(angle) * r;
      positions[i * 3 + 2] = anywhere ? -6 + Math.random() * 12 : -6;
      speeds[i] = 0.02 + Math.random() * 0.05;
    }
    for (let i = 0; i < COUNT; i++) resetParticle(i, true);
    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({
      color: 0xffa040, size: 0.06, transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false,
    }));
    particles.rotation.copy(rotor.rotation);
    scene.add(particles);

    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    resize();

    let running = true;
    let frameId = null;
    function frame(time) {
      if (!running) return;
      const motion = reduceMotion.matches ? 0 : 1;
      rotor.rotation.z += 0.006 * motion;
      for (let i = 0; i < COUNT; i++) {
        positions[i * 3 + 2] += speeds[i] * motion;
        if (positions[i * 3 + 2] > 6) resetParticle(i, false);
      }
      particleGeo.attributes.position.needsUpdate = true;
      hot.intensity = 55 + Math.sin(time * 0.002) * 10 * motion;
      renderer.render(scene, camera);
      // With reduced motion, draw one still frame and stop the loop.
      frameId = motion ? requestAnimationFrame(frame) : null;
    }
    function play() { if (frameId === null) { running = true; frameId = requestAnimationFrame(frame); } }
    function pause() { running = false; if (frameId !== null) cancelAnimationFrame(frameId); frameId = null; }

    document.addEventListener("visibilitychange", () => (document.hidden ? pause() : play()));
    reduceMotion.addEventListener("change", play);
    play();
  }

  start();
</script>
</body>
</html>
